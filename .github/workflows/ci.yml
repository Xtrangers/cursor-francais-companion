name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.302"

      - name: Restore
        run: dotnet restore CursorFrancais.slnx

      - name: Build
        run: dotnet build CursorFrancais.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test CursorFrancais.slnx --no-build --configuration Release --verbosity minimal
